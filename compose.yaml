name: modsage

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: modsage
      POSTGRES_USER: modsage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modsage-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modsage -d modsage"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    environment: &api-environment
      MODSAGE_DATABASE_URL: postgresql+psycopg://modsage:${POSTGRES_PASSWORD:-modsage-local-only}@db:5432/modsage
      MODSAGE_STEAM_API_KEY: ${MODSAGE_STEAM_API_KEY:-}
      MODSAGE_LLM_API_KEY: ${MODSAGE_LLM_API_KEY:-}
      MODSAGE_LLM_BASE_URL: ${MODSAGE_LLM_BASE_URL:-}
      MODSAGE_LLM_MODEL: ${MODSAGE_LLM_MODEL:-}
      MODSAGE_LLM_MAX_OUTPUT_TOKENS: ${MODSAGE_LLM_MAX_OUTPUT_TOKENS:-900}
      MODSAGE_LLM_TOKEN_PARAMETER: ${MODSAGE_LLM_TOKEN_PARAMETER:-max_tokens}
      # '-' preserves an explicitly blank value, which means omit temperature.
      MODSAGE_LLM_TEMPERATURE: ${MODSAGE_LLM_TEMPERATURE-0}
      MODSAGE_LLM_TIMEOUT_SECONDS: ${MODSAGE_LLM_TIMEOUT_SECONDS:-15}
      MODSAGE_RECOMMENDATION_TIMEOUT_SECONDS: ${MODSAGE_RECOMMENDATION_TIMEOUT_SECONDS:-25}
      MODSAGE_REQUEST_LIMIT_PER_MINUTE: ${MODSAGE_REQUEST_LIMIT_PER_MINUTE:-20}
      MODSAGE_PROVIDER_CALLS_ENABLED: ${MODSAGE_PROVIDER_CALLS_ENABLED:-true}
      MODSAGE_PROVIDER_DAILY_CALL_LIMIT: ${MODSAGE_PROVIDER_DAILY_CALL_LIMIT:-200}
      MODSAGE_PROVIDER_MINUTE_CALL_LIMIT: ${MODSAGE_PROVIDER_MINUTE_CALL_LIMIT:-30}
      MODSAGE_ADMIN_TOKEN: ${MODSAGE_ADMIN_TOKEN:-}
      # A separate service below processes durable recommendations in Compose.
      MODSAGE_RECOMMENDATION_WORKER_ENABLED: "false"
      MODSAGE_RECOMMENDATION_POLL_SECONDS: ${MODSAGE_RECOMMENDATION_POLL_SECONDS:-0.5}
      MODSAGE_RECOMMENDATION_LEASE_SECONDS: ${MODSAGE_RECOMMENDATION_LEASE_SECONDS:-30}
      MODSAGE_RECOMMENDATION_MAX_ATTEMPTS: ${MODSAGE_RECOMMENDATION_MAX_ATTEMPTS:-3}
      MODSAGE_RECOMMENDATION_QUEUE_LIMIT: ${MODSAGE_RECOMMENDATION_QUEUE_LIMIT:-100}
      MODSAGE_RECOMMENDATION_SSE_SECONDS: ${MODSAGE_RECOMMENDATION_SSE_SECONDS:-25}
      MODSAGE_RECOMMENDATION_STREAM_LIMIT: ${MODSAGE_RECOMMENDATION_STREAM_LIMIT:-32}
      MODSAGE_RETRIEVAL_MODE: ${MODSAGE_RETRIEVAL_MODE:-bm25}
      MODSAGE_RETRIEVAL_CATALOG_LIMIT: ${MODSAGE_RETRIEVAL_CATALOG_LIMIT:-5000}
      MODSAGE_RETRIEVAL_CANDIDATE_LIMIT: ${MODSAGE_RETRIEVAL_CANDIDATE_LIMIT:-50}
      MODSAGE_EMBEDDING_API_KEY: ${MODSAGE_EMBEDDING_API_KEY:-}
      MODSAGE_EMBEDDING_BASE_URL: ${MODSAGE_EMBEDDING_BASE_URL:-}
      MODSAGE_EMBEDDING_MODEL: ${MODSAGE_EMBEDDING_MODEL:-}
      MODSAGE_EMBEDDING_RESPONSE_MODEL: ${MODSAGE_EMBEDDING_RESPONSE_MODEL:-}
      MODSAGE_EMBEDDING_DIMENSIONS: ${MODSAGE_EMBEDDING_DIMENSIONS:-}
      MODSAGE_EMBEDDING_TIMEOUT_SECONDS: ${MODSAGE_EMBEDDING_TIMEOUT_SECONDS:-10}
      MODSAGE_EMBEDDING_MIN_SIMILARITY: ${MODSAGE_EMBEDDING_MIN_SIMILARITY:-0.35}
      MODSAGE_REFRESH_ENABLED: ${MODSAGE_REFRESH_ENABLED:-false}
      MODSAGE_REFRESH_SOURCE: ${MODSAGE_REFRESH_SOURCE:-api}
      MODSAGE_REFRESH_HOUR: ${MODSAGE_REFRESH_HOUR:-8}
      MODSAGE_REFRESH_MINUTE: ${MODSAGE_REFRESH_MINUTE:-0}
      MODSAGE_REFRESH_LIMIT_PER_SORT: ${MODSAGE_REFRESH_LIMIT_PER_SORT:-20}
      MODSAGE_REFRESH_ENRICH_LIMIT: ${MODSAGE_REFRESH_ENRICH_LIMIT:-0}
      MODSAGE_REFRESH_MAX_ATTEMPTS: ${MODSAGE_REFRESH_MAX_ATTEMPTS:-3}
      MODSAGE_REFRESH_LEASE_SECONDS: ${MODSAGE_REFRESH_LEASE_SECONDS:-60}
      MODSAGE_REFRESH_REQUEST_BUDGET_SECONDS: ${MODSAGE_REFRESH_REQUEST_BUDGET_SECONDS:-180}
      MODSAGE_REFRESH_POLL_SECONDS: ${MODSAGE_REFRESH_POLL_SECONDS:-15}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  recommendation-worker:
    build:
      context: ./apps/api
    command: ["python", "-m", "modsage.cli", "recommendation-worker"]
    environment: *api-environment
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker:
    profiles: [automation]
    build:
      context: ./apps/api
    command: ["python", "-m", "modsage.cli", "worker"]
    environment: *api-environment
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    environment:
      API_BASE_URL: http://api:8000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:
